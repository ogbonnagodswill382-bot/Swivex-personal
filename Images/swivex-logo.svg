<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="swivexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="100" height="100" rx="26" fill="#0F172A" />
  <rect width="98" height="98" x="1" y="1" rx="25" fill="none" stroke="url(#swivexGrad)" stroke-width="2" stroke-opacity="0.5" />

  <!-- Stylized 'S' Mesh Logo -->
  <path d="M 68 32 C 68 23 58 20 48 20 C 35 20 28 27 28 36 C 28 50 68 45 68 62 C 68 73 57 80 44 80 C 30 80 22 71 22 62" 
        stroke="url(#swivexGrad)" 
        stroke-width="11" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Accent Nodes -->
  <circle cx="68" cy="32" r="5" fill="#06B6D4" />
  <circle cx="22" cy="62" r="5" fill="#6366F1" />
</svg>
